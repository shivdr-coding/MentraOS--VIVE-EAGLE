import groovy.json.JsonSlurper
import java.security.MessageDigest

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'signing'

def packageJson = new JsonSlurper().parse(file("../package.json"))
def mavenGroupId = 'com.mentraglass'
def mavenPublishVersion = (findProperty('mentraMavenVersion') ?: System.getenv('MENTRA_MAVEN_VERSION') ?: packageJson.version).toString()
// Inside an Expo host such as the MentraOS app, autolinking provides
// :expo-modules-core. Without it, this directory is the root of a standalone
// build (settings.gradle), for example a composite build in a plain Android app.
// expo-modules-core has no prebuilt Android artifact to resolve instead, so a
// standalone build leaves out the Expo adapter classes and defaults to the
// public Maven artifact's dependency shape.
def standaloneBuild = findProject(':expo-modules-core') == null
def publicMavenSdk = (findProperty('mentraPublicSdk') ?: System.getenv('MENTRA_PUBLIC_SDK') ?: standaloneBuild.toString()).toString().toBoolean()

// Download Sherpa-ONNX Android AAR from the upstream GitHub release and stage
// it as a Maven artifact in a tiny on-disk repository under libs/maven/.
// Why this shape:
//   - Jitpack stopped publishing for v1.13.2+ (their build step fails because
//     the AAR asset isn't present when its install-file step runs).
//   - We can't just `implementation files("…aar")` because AGP refuses local
//     .aar deps from library modules ("Direct local .aar file dependencies
//     are not supported when building an AAR"). Maven-coord deps are fine.
// The SHA-256 is pinned (matches the upstream checksum.txt for v1.13.2) so a
// tampered or partially-written artifact is rejected before being used.
def sherpaOnnxGroup = "com.k2fsa.sherpa.onnx"
def sherpaOnnxArtifact = "sherpa-onnx"
def sherpaOnnxVersion = "1.13.2"
def sherpaOnnxSha256 = "aa5505c0ec4f8bdaee5f214a64ba3012be64f2aecc022e82a64f33392b8dd245"

def sherpaOnnxMavenRoot = file("libs/maven")
def sherpaOnnxRepoDir = new File(
  sherpaOnnxMavenRoot,
  "${sherpaOnnxGroup.replace('.', '/')}/${sherpaOnnxArtifact}/${sherpaOnnxVersion}"
)
def sherpaOnnxAar = new File(sherpaOnnxRepoDir, "${sherpaOnnxArtifact}-${sherpaOnnxVersion}.aar")
def sherpaOnnxPom = new File(sherpaOnnxRepoDir, "${sherpaOnnxArtifact}-${sherpaOnnxVersion}.pom")

def sha256OfFile = { File f ->
  def digest = MessageDigest.getInstance("SHA-256")
  f.withInputStream { input ->
    def buf = new byte[64 * 1024]
    int n
    while ((n = input.read(buf)) != -1) {
      digest.update(buf, 0, n)
    }
  }
  digest.digest().collect { String.format("%02x", it & 0xff) }.join("")
}

// If a stale AAR exists with the wrong hash (e.g. from a previous failed
// download or a version bump), drop it so we re-fetch.
if (sherpaOnnxAar.exists() && sha256OfFile(sherpaOnnxAar) != sherpaOnnxSha256) {
  logger.lifecycle("Sherpa-ONNX AAR checksum mismatch on disk; redownloading.")
  if (!sherpaOnnxAar.delete()) {
    throw new GradleException(
      "Sherpa-ONNX AAR at ${sherpaOnnxAar.absolutePath} has a mismatched SHA-256 " +
      "but could not be deleted. Refusing to continue with a potentially tampered artifact."
    )
  }
}

if (!sherpaOnnxAar.exists()) {
  sherpaOnnxRepoDir.mkdirs()
  def sherpaOnnxUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaOnnxVersion}/${sherpaOnnxArtifact}-${sherpaOnnxVersion}.aar"
  logger.lifecycle("Downloading Sherpa-ONNX AAR v${sherpaOnnxVersion} from GitHub release…")
  // Download to a .part sibling and rename only after the SHA-256 matches, so
  // an interrupted or tampered download can't be silently accepted as valid.
  def partial = file("${sherpaOnnxAar.absolutePath}.part")
  try {
    new URL(sherpaOnnxUrl).withInputStream { input ->
      partial.withOutputStream { output -> output << input }
    }
    def actual = sha256OfFile(partial)
    if (actual != sherpaOnnxSha256) {
      throw new GradleException(
        "Sherpa-ONNX AAR v${sherpaOnnxVersion} SHA-256 mismatch.\n" +
        "  expected: ${sherpaOnnxSha256}\n" +
        "  actual:   ${actual}\n" +
        "Refusing to use the downloaded artifact."
      )
    }
    if (!partial.renameTo(sherpaOnnxAar)) {
      throw new GradleException("Failed to move ${partial.name} to ${sherpaOnnxAar.name}")
    }
  } finally {
    if (partial.exists()) {
      partial.delete()
    }
  }
}

// Minimal POM so the Maven resolver is happy. No transitive deps — the AAR
// ships its own native libs, including its own libonnxruntime.so.
if (!sherpaOnnxPom.exists()) {
  sherpaOnnxPom.text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${sherpaOnnxGroup}</groupId>
  <artifactId>${sherpaOnnxArtifact}</artifactId>
  <version>${sherpaOnnxVersion}</version>
  <packaging>aar</packaging>
</project>
"""
}

// HTC VIVE AI Glasses SDK for the VIVE Eagle driver (sgcs/ViveEagle.kt).
// HTC's SDK is a proprietary download with no public Maven repository, so it is
// never committed: each developer places it in libs/vive-eagle-sdk/ (gitignored
// except its README, which says exactly what goes there). It arrives as:
//   - repository/: a complete local Maven repo HTC generated, with its own POM,
//     Gradle module metadata and checksums for viveglass_client. Used as is.
//   - ViveGlassSimulator-release.aar: a loose AAR. AGP rejects raw .aar files
//     in a library module (see Sherpa above), so it is staged into libs/maven/
//     with a minimal POM, the same way as Sherpa-ONNX.
// Both AARs are SHA-256 pinned. When the folder is empty (CI, fresh clones),
// the build does not fail: it warns and compiles src/viveEagleStub/ instead of
// the real driver, so an Eagle connection attempt reports a pairing failure.
def viveSdkVersion = "0.6.1"
def viveSdkGroup = "com.htc.viveglass.sdk"
def viveClientArtifact = "viveglass_client"
def viveClientSha256 = "55c3c321a65495dae2f86ece2a7d8fe3b76d920e79d7680ce121050fa44cd17f"
def viveSimulatorArtifact = "viveglass_simulator"
def viveSimulatorSha256 = "b0ce80a746b465aadf3eaaaeef2b5a25a289ad7071b8364caca568358152a955"

def viveSdkDir = file("libs/vive-eagle-sdk")
def viveSdkRepo = new File(viveSdkDir, "repository")
def viveClientAar = new File(
  viveSdkRepo,
  "${viveSdkGroup.replace('.', '/')}/${viveClientArtifact}/${viveSdkVersion}/${viveClientArtifact}-${viveSdkVersion}.aar"
)
def viveSimulatorSourceAar = new File(viveSdkDir, "ViveGlassSimulator-release.aar")
def viveSdkReadme = "mobile/modules/bluetooth-sdk/android/libs/vive-eagle-sdk/README.md"

def viveSdkAvailable = viveClientAar.exists() && viveSimulatorSourceAar.exists()
if (!viveSdkAvailable && (viveClientAar.exists() || viveSimulatorSourceAar.exists())) {
  throw new GradleException(
    "VIVE AI Glasses SDK is only partly present in ${viveSdkDir.absolutePath}.\n" +
    "  ${viveClientAar.exists() ? 'found  ' : 'MISSING'} ${viveSdkDir.toPath().relativize(viveClientAar.toPath())}\n" +
    "  ${viveSimulatorSourceAar.exists() ? 'found  ' : 'MISSING'} ${viveSimulatorSourceAar.name}\n" +
    "Add the missing file (see ${viveSdkReadme}), or remove both to build without the VIVE Eagle driver."
  )
}

if (viveSdkAvailable) {
  def viveClientActual = sha256OfFile(viveClientAar)
  if (viveClientActual != viveClientSha256) {
    throw new GradleException(
      "VIVE AI Glasses SDK ${viveClientAar.name} SHA-256 mismatch.\n" +
      "  expected: ${viveClientSha256} (SDK ${viveSdkVersion})\n" +
      "  actual:   ${viveClientActual}\n" +
      "Use the ${viveSdkVersion} SDK download (see ${viveSdkReadme}), or update the pinned version and hash in build.gradle."
    )
  }
  def viveSimulatorActual = sha256OfFile(viveSimulatorSourceAar)
  if (viveSimulatorActual != viveSimulatorSha256) {
    throw new GradleException(
      "VIVE AI Glasses SDK ${viveSimulatorSourceAar.name} SHA-256 mismatch.\n" +
      "  expected: ${viveSimulatorSha256} (SDK ${viveSdkVersion})\n" +
      "  actual:   ${viveSimulatorActual}\n" +
      "Use the ${viveSdkVersion} SDK download (see ${viveSdkReadme}), or update the pinned version and hash in build.gradle."
    )
  }

  // Stage the simulator next to Sherpa in libs/maven/, recopying when stale.
  def viveSimulatorRepoDir = new File(
    sherpaOnnxMavenRoot,
    "${viveSdkGroup.replace('.', '/')}/${viveSimulatorArtifact}/${viveSdkVersion}"
  )
  def viveSimulatorAar = new File(viveSimulatorRepoDir, "${viveSimulatorArtifact}-${viveSdkVersion}.aar")
  def viveSimulatorPom = new File(viveSimulatorRepoDir, "${viveSimulatorArtifact}-${viveSdkVersion}.pom")
  if (!viveSimulatorAar.exists() || sha256OfFile(viveSimulatorAar) != viveSimulatorSha256) {
    viveSimulatorRepoDir.mkdirs()
    java.nio.file.Files.copy(
      viveSimulatorSourceAar.toPath(),
      viveSimulatorAar.toPath(),
      java.nio.file.StandardCopyOption.REPLACE_EXISTING
    )
  }
  // Minimal POM. viveglass_client is declared separately. The simulator's
  // optional control panel (showUI) is a Material BottomSheetDialogFragment with
  // a ConstraintLayout layout, so those two are runtime deps, at the versions
  // HTC's sample app uses. Runtime scope keeps them off the compile classpath.
  def viveSimulatorPomText = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${viveSdkGroup}</groupId>
  <artifactId>${viveSimulatorArtifact}</artifactId>
  <version>${viveSdkVersion}</version>
  <packaging>aar</packaging>
  <dependencies>
    <dependency>
      <groupId>com.google.android.material</groupId>
      <artifactId>material</artifactId>
      <version>1.12.0</version>
      <scope>runtime</scope>
    </dependency>
    <dependency>
      <groupId>androidx.constraintlayout</groupId>
      <artifactId>constraintlayout</artifactId>
      <version>2.1.4</version>
      <scope>runtime</scope>
    </dependency>
  </dependencies>
</project>
"""
  if (!viveSimulatorPom.exists() || viveSimulatorPom.text != viveSimulatorPomText) {
    viveSimulatorPom.text = viveSimulatorPomText
  }
} else {
  logger.warn(
    "WARNING: VIVE AI Glasses SDK not found in ${viveSdkDir.absolutePath}.\n" +
    "  Building WITHOUT the VIVE Eagle driver: a stub ViveEagle (src/viveEagleStub/) is compiled instead,\n" +
    "  and connecting a VIVE Eagle fails with VIVE_SDK_NOT_BUNDLED.\n" +
    "  To build the real driver, see ${viveSdkReadme}."
  )
}

repositories {
  maven { url = uri(sherpaOnnxMavenRoot) }
  if (viveSdkAvailable) {
    maven {
      url = uri(viveSdkRepo)
      content { includeGroup(viveSdkGroup) }
    }
  }
  maven { url 'https://jitpack.io' }
}


group = mavenGroupId
version = mavenPublishVersion

def credentialValue = { List<String> propertyNames, List<String> envNames ->
  for (propertyName in propertyNames) {
    def value = findProperty(propertyName)
    if (value != null && value.toString().trim()) {
      return value.toString()
    }
  }
  for (envName in envNames) {
    def value = System.getenv(envName)
    if (value != null && value.trim()) {
      return value
    }
  }
  return null
}

def centralTokenParts = { boolean failOnInvalid = false ->
  def token = credentialValue(['sonatypeTokenBase64', 'mavenCentralTokenBase64'], ['SONATYPE_TOKEN_BASE64', 'MAVEN_CENTRAL_TOKEN_BASE64'])
  if (!token) {
    return null
  }
  def decoded
  try {
    decoded = new String(token.decodeBase64(), 'UTF-8')
  } catch (Exception e) {
    if (failOnInvalid) {
      throw new GradleException('Sonatype token must be valid base64 for username:password', e)
    }
    return null
  }
  def separator = decoded.indexOf(':')
  if (separator <= 0) {
    if (failOnInvalid) {
      throw new GradleException('Sonatype token must decode to username:password')
    }
    return null
  }
  return [decoded.substring(0, separator), decoded.substring(separator + 1)]
}

def centralUsername = { boolean failOnInvalidToken = false ->
  credentialValue(['sonatypeUsername', 'mavenCentralUsername'], ['SONATYPE_USERNAME', 'MAVEN_CENTRAL_USERNAME']) ?: centralTokenParts(failOnInvalidToken)?.get(0)
}

def centralPassword = { boolean failOnInvalidToken = false ->
  credentialValue(['sonatypePassword', 'mavenCentralPassword'], ['SONATYPE_PASSWORD', 'MAVEN_CENTRAL_PASSWORD']) ?: centralTokenParts(failOnInvalidToken)?.get(1)
}

def signingKey = {
  credentialValue(['signingKey'], ['SIGNING_KEY'])
}

def signingPassword = {
  credentialValue(['signingPassword'], ['SIGNING_PASSWORD'])
}

def shouldUseGpgCmd = {
  (credentialValue(['signing.useGpgCmd'], ['SIGNING_USE_GPG_CMD']) ?: 'false').toBoolean()
}

def isCentralPublishTask = {
  gradle.taskGraph.allTasks.any { it.name.toLowerCase().contains('sonatypecentral') }
}

gradle.taskGraph.whenReady {
  if (isCentralPublishTask()) {
    centralUsername(true)
    centralPassword(true)
  }
}

if (standaloneBuild) {
  apply plugin: 'kotlin-android'
  // Java 17 bytecode, as in the MentraOS app build.
  android {
    compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
    }
  }
  kotlin {
    compilerOptions {
      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
  }
  // Expo adapters, compiled only inside an Expo host (see expo-module.config.json).
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude(
      '**/com/mentra/bluetoothsdk/BluetoothSdkModule.kt',
      '**/com/mentra/bluetoothsdk/MentraLocalNetworkModule.kt',
      '**/com/mentra/bluetoothsdk/otaserver/MentraOtaServerModule.kt',
      '**/com/mentra/bluetoothsdk/photoreceiver/MentraPhotoReceiverModule.kt'
    )
  }
} else {
  def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
  apply from: expoModulesCorePlugin
  applyKotlinExpoModulesCorePlugin()
  useExpoPublishing()
}

// Source builds use Kotlin 2.3 for avif-coder (and Crust's QuickJS when present).
// Keep the public Maven artifact usable from Kotlin 2.1 builds:
// 2.2 metadata (a 2.1 compiler reads one version ahead; 2.2 is also the lowest
// language version that reads the 2.3 expo-modules-core classes compiled here),
// 2.1 stdlib APIs, and a kotlin-stdlib 2.1.20 dependency in the POM.
if (publicMavenSdk) {
  kotlin {
    coreLibrariesVersion = "2.1.20"
    compilerOptions {
      languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
      apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_1
    }
  }
}

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 28)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "com.mentra.bluetoothsdk"
  buildFeatures {
    buildConfig true
  }
  defaultConfig {
    versionCode 1
    versionName project.version
    buildConfigField "String", "SDK_VERSION", "\"${project.version}\""
  }
  publishing {
    singleVariant("release") {
      withSourcesJar()
      withJavadocJar()
    }
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }
  packagingOptions {
    pickFirst '**/libjsc.so'
    pickFirst '**/libc++_shared.so'
    pickFirst '**/libonnxruntime.so'
    pickFirst '**/libonnxruntime4j_jni.so'
  }
}

// Without the vendored HTC SDK (see the VIVE Eagle block at the top), swap the
// real driver for the stub. The stub's file has a different name
// (ViveEagleUnavailable.kt) so this exclude only drops the real one.
if (!viveSdkAvailable) {
  android.sourceSets.main.java.srcDir('src/viveEagleStub/java')
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude('**/com/mentra/bluetoothsdk/sgcs/ViveEagle.kt')
  }
}

dependencies {
  // Expo adapter class is compiled into the MentraOS module, but the bare SDK
  // artifact should not expose Expo as a runtime dependency.
  if (!standaloneBuild) {
    compileOnly project(':expo-modules-core')
  }

  // Kotlin standard library (explicitly added for IDE support)
  // Version is managed by Expo modules, but explicit dependency helps IDE indexing
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7"
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
  
  implementation "androidx.lifecycle:lifecycle-service:2.6.1"
  implementation "org.greenrobot:eventbus:3.3.1"
  implementation 'com.google.code.gson:gson:2.10.1'

  // Google Play Services for location settings dialog
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  implementation 'com.google.android.gms:play-services-base:18.2.0'

  // Apache Commons Compress for tar.bz2 extraction
  implementation 'org.apache.commons:commons-compress:1.24.0'

  // OkHttp for HTTP requests
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'

  // AVIF decode for BLE photo fallback. Public Maven artifacts omit this
  // decoder from runtime metadata; Android 12+ can still use the platform
  // decoder, while MentraOS app builds keep Coder for broader fallback.
  // 3.0.0 ships 16 KB-aligned libcoder.so (1.7.3 was 4 KB). Its POM depends
  // on kotlin-stdlib 2.3.0. Exclude it to keep the public SDK's runtime
  // dependencies on 2.1; the Expo plugin selects a 2.3 source compiler to
  // read the decoder's metadata, independently of this stdlib exclusion.
  dependencies.add(publicMavenSdk ? 'compileOnly' : 'implementation', 'io.github.awxkee:avif-coder:3.0.0') {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
  }

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.11.1'
  testImplementation 'org.assertj:assertj-core:3.24.2'
  // The Android SDK jar stubs org.json in JVM unit tests; the queue serializes real JSON.
  testImplementation 'org.json:json:20240303'
  testImplementation 'androidx.test:core:1.5.0'

  // Local photo upload receiver
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

  // AR99 GATT Opus to PCM decoder.
  implementation 'io.github.jaredmdobson:concentus:1.0.1'

  // LC3 audio codec library
  implementation project(':lc3Lib')

  // These integrations are used by the full MentraOS app, but are not exposed
  // through the public SDK API. Public Maven artifacts compile against them
  // without publishing them as runtime transitives, so consumers only need
  // Maven Central/Google repositories for normal SDK use.
  def optionalMentraOsIntegrationDependency = publicMavenSdk ? 'compileOnly' : 'implementation'

  // Sherpa-ONNX for on-device transcription, the wake word and Silero speech
  // activity (com.k2fsa.sherpa.onnx.Vad, model in src/main/assets/vad/).
  // Jitpack's v1.13.2 build failed upstream, so we stage the prebuilt AAR into
  // libs/maven/ (see top of file) and consume it as a Maven coord — AGP rejects
  // raw files() .aar deps in library modules.
  dependencies.add(optionalMentraOsIntegrationDependency, "${sherpaOnnxGroup}:${sherpaOnnxArtifact}:${sherpaOnnxVersion}@aar")

  if (!publicMavenSdk) {
    // Vuzix Z100
    implementation 'com.vuzix:ultralite-sdk-android:1.8'
    implementation 'com.squareup.picasso:picasso:2.8'
  } else {
    compileOnly 'com.vuzix:ultralite-sdk-android:1.8'
    compileOnly 'com.squareup.picasso:picasso:2.8'
  }

  // HTC VIVE AI Glasses SDK for the VIVE Eagle, from the local vendor folder
  // (see the top of this file). The simulator is ViveEagle's default adapter
  // (USE_SIMULATOR), so it is needed at runtime in app builds too.
  if (viveSdkAvailable) {
    dependencies.add(optionalMentraOsIntegrationDependency, "${viveSdkGroup}:${viveClientArtifact}:${viveSdkVersion}")
    dependencies.add(optionalMentraOsIntegrationDependency, "${viveSdkGroup}:${viveSimulatorArtifact}:${viveSdkVersion}")
  }

  implementation 'com.google.protobuf:protobuf-java:4.32.0'
  implementation 'com.google.protobuf:protobuf-java-util:4.32.0'
}

afterEvaluate {
  publishing {
    publications {
      release(MavenPublication) {
        groupId = mavenGroupId
        artifactId = 'bluetooth-sdk'
        version = project.version

        from components.release

        pom {
          name = 'Mentra Bluetooth SDK'
          description = 'SDK for communicating with smart glasses'
          url = 'https://github.com/Mentra-Community/MentraOS'
          licenses {
            license {
              name = 'Apache License, Version 2.0'
              url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
          }
          developers {
            developer {
              id = 'mentra'
              name = 'Mentra'
              email = 'dev@mentra.glass'
            }
          }
          scm {
            connection = 'scm:git:https://github.com/Mentra-Community/MentraOS.git'
            developerConnection = 'scm:git:ssh://git@github.com:Mentra-Community/MentraOS.git'
            url = 'https://github.com/Mentra-Community/MentraOS'
          }
        }
      }
    }
    repositories {
      maven {
        name = 'sonatypeCentral'
        def repositoryUrl = System.getenv('MENTRA_MAVEN_STAGING_REPOSITORY_URL') ?: 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
        url = uri(repositoryUrl)
        if (repositoryUrl.startsWith('http')) {
          credentials {
            username = centralUsername()
            password = centralPassword()
          }
        }
      }
    }
  }

  signing {
    def inMemorySigningKey = signingKey()
    if (inMemorySigningKey) {
      useInMemoryPgpKeys(inMemorySigningKey, signingPassword())
    } else if (shouldUseGpgCmd()) {
      useGpgCmd()
    }
    required {
      isCentralPublishTask()
    }
    sign publishing.publications.release
  }
}

tasks.withType(Sign).configureEach {
  onlyIf { isCentralPublishTask() }
}

tasks.register('uploadSonatypeCentralDeployment') {
  group = 'publishing'
  description = "Uploads the ${mavenGroupId} OSSRH compatibility repository to the Central Portal."
  def releasePublishTaskPath = project.path == ':'
    ? ':publishReleasePublicationToSonatypeCentralRepository'
    : "${project.path}:publishReleasePublicationToSonatypeCentralRepository"
  dependsOn ':lc3Lib:publishReleasePublicationToSonatypeCentralRepository',
    releasePublishTaskPath

  doLast {
    def username = centralUsername(true)
    def password = centralPassword(true)
    if (!username || !password) {
      throw new GradleException('Set sonatypeTokenBase64 or sonatypeUsername/sonatypePassword before uploading to Central.')
    }

    def publishingType = (findProperty('sonatypePublishingType') ?: System.getenv('SONATYPE_PUBLISHING_TYPE') ?: 'user_managed').toString()
    def endpoint = new URL("https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${mavenGroupId}?publishing_type=${publishingType}")
    def connection = endpoint.openConnection()
    connection.requestMethod = 'POST'
    connection.setRequestProperty('Authorization', "Bearer ${"${username}:${password}".bytes.encodeBase64()}")
    connection.setRequestProperty('Content-Length', '0')

    def statusCode = connection.responseCode
    def responseBody = statusCode >= 400 ? connection.errorStream?.text : connection.inputStream?.text
    if (statusCode < 200 || statusCode >= 300) {
      throw new GradleException("Central deployment upload failed with HTTP ${statusCode}: ${responseBody ?: ''}")
    }

    println "Sonatype Central deployment upload requested for ${mavenGroupId} (${publishingType})."
  }
}
